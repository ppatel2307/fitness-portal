# Render Blueprint - Infrastructure as Code
# This file defines the services for deployment on Render

services:
  # API Backend Service
  - type: web
    name: fitness-portal-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: fitness-portal-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # Set this manually after deploying frontend

databases:
  - name: fitness-portal-db
    plan: free
    databaseName: fitness_portal
    user: fitness_user
    region: oregon
